# ── Perfil: prod (Produccion y Despliegue en Contenedores) ───────────────────
# Activar con: -Dspring.profiles.active=prod o SPRING_PROFILES_ACTIVE=prod

# Datasource: se inyecta obligatoriamente mediante variables de entorno
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/sistema_academico}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate: Prohibido ddl-auto=update o create. Solo validacion estricta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway: migraciones explicitas y reproducibles en cada arranque
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# Servidor y Proxy Reverso (detras de Nginx)
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Compresion HTTP para respuestas API
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Seguridad: Bootstrap inicial activable por variable de entorno para primer arranque
security.bootstrap.admin.enabled=${SECURITY_BOOTSTRAP_ADMIN_ENABLED:true}
security.bootstrap.admin.username=${SECURITY_ADMIN_USERNAME:admin}
security.bootstrap.admin.password=${SECURITY_ADMIN_PASSWORD:Admin123*}

# JWT y secretos
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# Logs estructurados y limpios para syslog / docker log drivers
logging.level.root=INFO
logging.level.com.jackren.sistemaacademico=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO
