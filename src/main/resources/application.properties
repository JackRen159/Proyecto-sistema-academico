spring.application.name=sistema-academico-backend

# Datasource
# Las credenciales reales se leen desde variables de entorno o desde
# application-local.properties (excluido de Git via .gitignore).
# Nunca escribir contrasenas directamente en este archivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_academico}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
# ddl-auto=validate: Hibernate verifica que el esquema coincida con las entidades
# pero no lo modifica. Flyway es la unica autoridad del esquema.
spring.jpa.hibernate.ddl-auto=validate

# show-sql activo solo en perfil dev (ver application-dev.properties)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT / Seguridad
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}
