# ── Perfil: dev ──────────────────────────────────────────────────────────────
# Activar con: -Dspring.profiles.active=dev
# Las credenciales reales se leen desde variables de entorno o desde
# application-local.properties (gitignored).

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Importar configuracion local opcional (variables no commiteadas)
spring.config.import=optional:file:./application-local.properties

# Bootstrap de administrador inicial (solo perfil dev)
security.bootstrap.admin.enabled=true
security.bootstrap.admin.username=${SECURITY_ADMIN_USERNAME:admin}
security.bootstrap.admin.password=${SECURITY_ADMIN_PASSWORD:Admin123*}

# Precarga de datos para demostración y simulación de los 7 casos de uso
demo.seed.enabled=true

# Flyway: permite que arranque con un esquema ya existente (solo primera vez).
# Remueve esta propiedad después de aplicar V1 por primera vez.
# spring.flyway.baseline-on-migrate=true

