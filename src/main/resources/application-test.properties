# ── Perfil: test ─────────────────────────────────────────────────────────────
# Activar con: -Dspring.profiles.active=test
# Usado por mvn test. Apunta a una base de datos de prueba separada.
# Para pruebas de integración con Testcontainers, las propiedades
# de datasource se sobreescriben dinámicamente por el contenedor.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

