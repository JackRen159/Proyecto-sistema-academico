          example: 1
        gradoId:
          type: integer
          format: int64
          example: 10
        nombre:
          type: string
          maxLength: 20
          example: "A"
        jornada:
          $ref: '#/components/schemas/Jornada'
        cupoMaximo:
          type: integer
          minimum: 1
          example: 35

    GrupoResponse:
      type: object
      properties:
