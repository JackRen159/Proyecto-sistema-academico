components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT emitido por `/api/auth/login`. Envíe la cabecera HTTP:

        `Authorization: Bearer <token>`

        '
  responses:
    BadRequestError:
      description: Datos inválidos o faltantes en la solicitud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Autenticación requerida o credenciales inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Acceso denegado por permisos o rol insuficiente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Conflicto con el estado actual o violación de invariante de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Rol:
      type: string
      enum:
      - ADMINISTRADOR
      - RECTOR
      - COORDINADOR
      - COORDINADOR_ACADEMICO
      - COORDINADOR_CONVIVENCIA
      - ORIENTADOR_ESCOLAR
      - PROFESOR
      - ESTUDIANTE
      - ACUDIENTE
      - SECRETARIA
      - HISTORICO_RESTRINGIDO
      example: ADMINISTRADOR
    Parentesco:
      type: string
      enum:
      - PADRE
      - MADRE
      - ABUELO
      - ABUELA
      - TIO
      - TIA
      - PRIMO
      - PRIMA
      - HERMANO_MAYOR
      - TUTOR_LEGAL
      - OTRO
      example: MADRE
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          maxLength: 50
          example: admin
        password:
          type: string
          format: password
          example: Admin123*
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        username:
          type: string
          example: admin
        rol:
          $ref: '#/components/schemas/Rol'
        expiresIn:
          type: integer
          format: int64
          description: Tiempo de expiración en segundos (ej. 28800 = 8 horas).
          example: 28800
        debeCambiarPassword:
          type: boolean
          example: false
        politicaAceptada:
          type: boolean
          example: true
        rolesDisponibles:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
          example: true
        estado:
          $ref: '#/components/schemas/EstadoUsuario'
        debeCambiarPassword:
          type: boolean
          example: false
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
    EstudianteRequest:
      type: object
      required:
      - nombres
      - apellidos
      - documento
      - fechaNacimiento
      - direccion
      properties:
        nombres:
          type: string
          maxLength: 50
          example: Carlos Andrés
