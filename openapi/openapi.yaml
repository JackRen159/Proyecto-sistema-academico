      summary: Consultar calificaciones definitivas de un grupo, asignatura y periodo
      description: Retorna la sábana de notas definitivas de periodo para un curso y materia específicos.
      operationId: listarCalificacionesPeriodo
      parameters:
      - name: grupoId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: asignaturaId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: periodoId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Sábana de notas definitivas obtenida exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalificacionPeriodoResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/calificaciones/estudiante/{matriculaId}/periodo/{periodoId}:
    get:
      tags:
      - Calificaciones y SIEE
      summary: Consultar boletín / reporte de calificaciones de un estudiante en un periodo
      description: Retorna todas las calificaciones definitivas de un estudiante para un periodo académico.
      operationId: listarCalificacionesEstudiantePeriodo
      parameters:
      - name: matriculaId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: periodoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Calificaciones del estudiante obtenidas exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalificacionPeriodoResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /api/calificaciones/auditoria/matricula/{matriculaId}:
    get:
      tags:
      - Calificaciones y SIEE
      summary: Consultar historial inmutable de auditoría de calificaciones de una matrícula
      description: Retorna la trazabilidad completa de modificaciones a notas de actividades y definitivas de un estudiante.
      operationId: listarHistorialAuditoriaMatricula
      parameters:
      - name: matriculaId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Historial de auditoría obtenido exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditoriaCalificacionResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Token JWT emitido por `/api/auth/login`. Envíe la cabecera HTTP:

        `Authorization: Bearer <token>`

        '
  responses:
    BadRequestError:
      description: Datos inválidos o faltantes en la solicitud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Autenticación requerida o credenciales inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Acceso denegado por permisos o rol insuficiente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Conflicto con el estado actual o violación de invariante de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Rol:
      type: string
      enum:
      - ADMINISTRADOR
      - RECTOR
      - COORDINADOR
      - PROFESOR
      - ESTUDIANTE
      - ACUDIENTE
      - SECRETARIA
      example: ADMINISTRADOR
    Parentesco:
      type: string
      enum:
      - PADRE
      - MADRE
      - ABUELO
      - ABUELA
      - TIO
      - TIA
      - PRIMO
      - PRIMA
      - HERMANO_MAYOR
      - TUTOR_LEGAL
      - OTRO
      example: MADRE
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          maxLength: 50
          example: admin
        password:
          type: string
          format: password
          example: Admin123*
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        username:
          type: string
          example: admin
        rol:
          $ref: '#/components/schemas/Rol'
        expiresIn:
          type: integer
          format: int64
          description: Tiempo de expiración en segundos (ej. 28800 = 8 horas).
          example: 28800
    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
          example: true
