# -----------------------------------------------------------------------------
# COMPONENTES / SCHEMAS / SEGURIDAD
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT emitido por `/api/auth/login`. Envíe la cabecera HTTP:
        `Authorization: Bearer <token>`

  responses:
    BadRequestError:
      description: Datos inválidos o faltantes en la solicitud.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Autenticación requerida o credenciales inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Acceso denegado por permisos o rol insuficiente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Conflicto con el estado actual o violación de invariante de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ENUMS
    Rol:
      type: string
      enum:
        - ADMINISTRADOR
        - RECTOR
        - COORDINADOR
        - PROFESOR
        - ESTUDIANTE
        - ACUDIENTE
        - SECRETARIA
      example: ADMINISTRADOR

    Parentesco:
      type: string
      enum:
        - PADRE
        - MADRE
        - ABUELO
        - ABUELA
        - TIO
        - TIA
        - PRIMO
        - PRIMA
        - HERMANO_MAYOR
        - TUTOR_LEGAL
        - OTRO
      example: MADRE

    # AUTENTICACIÓN
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 50
          example: admin
        password:
          type: string
          format: password
          example: Admin123*

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        username:
          type: string
          example: admin
        rol:
          $ref: '#/components/schemas/Rol'
        expiresIn:
          type: integer
          format: int64
          description: Tiempo de expiración en segundos (ej. 28800 = 8 horas).
          example: 28800

    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: admin
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
          example: true

    # ESTUDIANTE
    EstudianteRequest:
      type: object
      required:
        - nombres
        - apellidos
        - documento
        - fechaNacimiento
        - direccion
      properties:
        nombres:
          type: string
          maxLength: 50
          example: Carlos Andrés
        apellidos:
          type: string
          maxLength: 50
          example: Pérez Gómez
        documento:
          type: string
          maxLength: 20
          example: 1001234567
        fechaNacimiento:
          type: string
          format: date
          example: 2010-05-15
        correo:
          type: string
          format: email
          maxLength: 100
          example: carlos.perez@colegio.edu.co
        telefono:
          type: string
          maxLength: 20
          example: 3001234567
        direccion:
          type: string
          maxLength: 150
          example: Calle 45 # 12-34 Barrio El Poblado

    EstudianteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombres:
          type: string
          example: Carlos Andrés
        apellidos:
          type: string
          example: Pérez Gómez
        documento:
          type: string
          example: 1001234567
        fechaNacimiento:
          type: string
          format: date
          example: 2010-05-15
        correo:
          type: string
          example: carlos.perez@colegio.edu.co
        telefono:
          type: string
          example: 3001234567
        direccion:
          type: string
          example: Calle 45 # 12-34 Barrio El Poblado
        activo:
          type: boolean
          example: true
        fechaCreacion:
          type: string
          format: date-time
          example: 2026-03-01T10:00:00
        fechaActualizacion:
          type: string
          format: date-time
          example: 2026-03-01T10:00:00

    # ACUDIENTE
    AcudienteRequest:
      type: object
      required:
        - nombres
        - apellidos
        - documento
        - telefono
        - correo
        - direccion
        - ocupacion
      properties:
        nombres:
          type: string
          maxLength: 50
          example: Martha Cecilia
        apellidos:
          type: string
          maxLength: 50
          example: Gómez Rodríguez
        documento:
          type: string
          maxLength: 20
          example: 43567890
        telefono:
          type: string
          maxLength: 20
          example: 3109876543
        telefonoAlternativo:
          type: string
          maxLength: 20
          example: 6041234567
        correo:
          type: string
          format: email
          maxLength: 100
          example: martha.gomez@gmail.com
        direccion:
          type: string
          maxLength: 150
          example: Calle 45 # 12-34 Barrio El Poblado
        ocupacion:
          type: string
          maxLength: 80
          example: Ingeniera de Sistemas

    AcudienteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombres:
          type: string
          example: Martha Cecilia
        apellidos:
          type: string
          example: Gómez Rodríguez
        documento:
          type: string
          example: 43567890
        telefono:
          type: string
          example: 3109876543
        telefonoAlternativo:
          type: string
          example: 6041234567
        correo:
          type: string
          example: martha.gomez@gmail.com
        direccion:
          type: string
          example: Calle 45 # 12-34 Barrio El Poblado
        ocupacion:
          type: string
          example: Ingeniera de Sistemas
        activo:
          type: boolean
          example: true
        fechaCreacion:
          type: string
          format: date-time
          example: 2026-03-01T10:00:00
        fechaActualizacion:
          type: string
          format: date-time
          example: 2026-03-01T10:00:00

    # VINCULACIÓN
    EstudianteAcudienteRequest:
      type: object
      required:
        - documentoEstudiante
        - documentoAcudiente
        - parentesco
        - esPrincipal
        - conviveConEstudiante
        - autorizadoRetiro
      properties:
        documentoEstudiante:
          type: string
          maxLength: 20
          example: 1001234567
        documentoAcudiente:
          type: string
          maxLength: 20
          example: 43567890
        parentesco:
          $ref: '#/components/schemas/Parentesco'
        esPrincipal:
          type: boolean
          example: true
        conviveConEstudiante:
          type: boolean
          example: true
        autorizadoRetiro:
          type: boolean
          example: true

    EstudianteAcudienteResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        estudianteId:
          type: integer
          format: int64
          example: 1
        estudianteNombres:
          type: string
          example: Carlos Andrés
        estudianteApellidos:
          type: string
          example: Pérez Gómez
        estudianteDocumento:
          type: string
          example: 1001234567
        acudienteId:
          type: integer
          format: int64
          example: 1
        acudienteNombres:
          type: string
          example: Martha Cecilia
        acudienteApellidos:
          type: string
          example: Gómez Rodríguez
        acudienteDocumento:
          type: string
          example: 43567890
        acudienteTelefono:
          type: string
          example: 3109876543
        acudienteTelefonoAlternativo:
          type: string
          example: 6041234567
        acudienteCorreo:
          type: string
          example: martha.gomez@gmail.com
        parentesco:
          $ref: '#/components/schemas/Parentesco'
        esPrincipal:
          type: boolean
          example: true
        conviveConEstudiante:
          type: boolean
          example: true
        autorizadoRetiro:
          type: boolean
          example: true
        fechaVinculacion:
          type: string
          format: date-time
          example: 2026-03-01T10:00:00

    # PAGINACIÓN
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          example: 20
        number:
          type: integer
          example: 0
        totalElements:
          type: integer
          format: int64
          example: 1
        totalPages:
          type: integer
          example: 1

    PagedEstudianteResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/EstudianteResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    PagedAcudienteResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AcudienteResponse'
        page:
          $ref: '#/components/schemas/PageMetadata'

    # RESPUESTAS DE ERROR
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: 2026-03-01T12:00:00
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Datos invalidos
        mensaje:
          type: string
          example: Uno o mas campos no cumplen con las validaciones requeridas
        validaciones:
          type: object
          additionalProperties:
            type: string
          example:
            correo: El correo electronico no tiene un formato valido
            documento: El documento es obligatorio

    # -------------------------------------------------------------------------
    # SCHEMAS DE ESTRUCTURA ACADÉMICA (FRENTE 2)
    # -------------------------------------------------------------------------
    NivelEducativo:
      type: string
      enum:
        - PREESCOLAR
        - BASICA_PRIMARIA
        - BASICA_SECUNDARIA
        - MEDIA
      example: MEDIA

    EstadoAnioLectivo:
      type: string
      enum:
        - PLANIFICACION
        - ACTIVO
        - CERRADO
      example: ACTIVO

    EstadoPeriodo:
      type: string
      enum:
        - ABIERTO
        - CERRADO
      example: ABIERTO

    Jornada:
      type: string
      enum:
        - MANANA
        - TARDE
        - UNICA
        - NOCTURNA
        - COMPLETA
      example: MANANA

    GradoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        codigo:
          type: string
          example: "10"
        nombre:
          type: string
          example: "Décimo"
        nivel:
          $ref: '#/components/schemas/NivelEducativo'
        ordenJerarquico:
          type: integer
          example: 10
        activo:
          type: boolean
          example: true

    AreaRequest:
      type: object
      required:
        - codigo
        - nombre
      properties:
        codigo:
          type: string
          maxLength: 30
          example: "HUM"
        nombre:
          type: string
          maxLength: 100
          example: "Humanidades y Lengua Castellana"
        descripcion:
          type: string
          maxLength: 255
          example: "Área fundamental del currículo"

    AreaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        codigo:
          type: string
          example: "HUM"
        nombre:
          type: string
          example: "Humanidades y Lengua Castellana"
        descripcion:
          type: string
          example: "Área fundamental del currículo"
        activo:
          type: boolean
          example: true
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    AsignaturaRequest:
      type: object
      required:
        - codigo
        - nombre
      properties:
        areaId:
          type: integer
          format: int64
          nullable: true
          example: 1
        codigo:
          type: string
          maxLength: 30
          example: "FILO"
        nombre:
          type: string
          maxLength: 100
          example: "Filosofía"
        descripcion:
          type: string
          maxLength: 255
          example: "Asignatura adaptable de educación media"

    AsignaturaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        areaId:
          type: integer
          format: int64
          nullable: true
          example: 1
        areaNombre:
          type: string
          nullable: true
          example: "Humanidades"
        codigo:
          type: string
          example: "FILO"
        nombre:
          type: string
          example: "Filosofía"
        descripcion:
          type: string
          example: "Asignatura adaptable"
        activo:
          type: boolean
          example: true
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    GradoAsignaturaRequest:
      type: object
      required:
        - gradoId
        - asignaturaId
        - intensidadHoraria
      properties:
        gradoId:
          type: integer
          format: int64
          example: 10
        asignaturaId:
          type: integer
          format: int64
          example: 1
        intensidadHoraria:
          type: integer
          minimum: 1
          example: 3
        esOptativa:
          type: boolean
          default: false
          example: false

    GradoAsignaturaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        gradoId:
          type: integer
          format: int64
          example: 10
        gradoCodigo:
          type: string
          example: "10"
        gradoNombre:
          type: string
          example: "Décimo"
        asignaturaId:
          type: integer
          format: int64
          example: 1
        asignaturaCodigo:
          type: string
          example: "FILO"
        asignaturaNombre:
          type: string
          example: "Filosofía"
        intensidadHoraria:
          type: integer
          example: 3
        esOptativa:
          type: boolean
          example: false
        activo:
          type: boolean
          example: true
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    AnioLectivoRequest:
      type: object
      required:
        - anio
        - nombre
        - fechaInicio
        - fechaFin
      properties:
        anio:
          type: integer
          example: 2026
        nombre:
          type: string
          maxLength: 100
          example: "Año Escolar 2026"
        fechaInicio:
          type: string
          format: date
          example: "2026-01-15"
        fechaFin:
          type: string
          format: date
          example: "2026-11-30"

    AnioLectivoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        anio:
          type: integer
          example: 2026
        nombre:
          type: string
          example: "Año Escolar 2026"
        fechaInicio:
          type: string
          format: date
          example: "2026-01-15"
        fechaFin:
          type: string
          format: date
          example: "2026-11-30"
        estado:
          $ref: '#/components/schemas/EstadoAnioLectivo'
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    PeriodoAcademicoRequest:
      type: object
      required:
        - numero
