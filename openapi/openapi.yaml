        - fechaInicio
        - fechaFin
        - porcentaje
      properties:
        numero:
          type: integer
          minimum: 1
          maximum: 10
          example: 1
        nombre:
          type: string
          maxLength: 50
          example: "Primer Periodo"
        fechaInicio:
          type: string
          format: date
          example: "2026-01-15"
        fechaFin:
          type: string
          format: date
          example: "2026-04-15"
        porcentaje:
          type: number
          format: double
          minimum: 0.01
          maximum: 100.00
          example: 25.00

    PeriodoAcademicoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        anioLectivoId:
          type: integer
          format: int64
          example: 1
        numero:
          type: integer
          example: 1
        nombre:
          type: string
          example: "Primer Periodo"
        fechaInicio:
          type: string
          format: date
          example: "2026-01-15"
        fechaFin:
          type: string
          format: date
          example: "2026-04-15"
        porcentaje:
          type: number
          format: double
          example: 25.00
        estado:
          $ref: '#/components/schemas/EstadoPeriodo'
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

    GrupoRequest:
