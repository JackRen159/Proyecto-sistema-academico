openapi: 3.0.3
info:
  title: Sistema de Gestión Escolar API
  description: 'Contrato oficial y versionado de la API REST para el Sistema de Gestión
    Escolar.

    Gestiona autenticación stateless mediante JWT, control de acceso basado en roles
    (RBAC),

    estudiantes, acudientes y vinculaciones familiares con protección de unicidad
    para acudiente principal.

    '
  version: 1.0.0
  contact:
    name: Equipo de Desarrollo Sistema Escolar
    email: soporte@sistemaescolar.local
servers:
- url: http://localhost:8080
  description: Servidor de desarrollo local
security:
- BearerAuth: []
paths:
  /api/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión y obtener token JWT
      description: 'Autentica a un usuario mediante credenciales institucionales.

        Protegido por limitador de tasa (máximo 5 intentos por minuto por IP).

        Al superar el límite responde HTTP 429 con cabecera Retry-After.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa. Retorna token JWT y rol asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Solicitud inválida (campos vacíos o con formato erróneo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas o cuenta inactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas peticiones. Límite de tasa de inicio de sesión superado.
          headers:
            Retry-After:
              schema:
                type: integer
                example: 60
              description: Segundos de espera requeridos antes de reintentar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      tags:
      - Autenticación
      summary: Cerrar sesión e invalidar token JWT
      description: 'Registra el identificador único (`jti`) del token JWT en la lista
        de revocación

        del servidor para impedir su reutilización. El cliente SPA debe descartar
        el token en memoria.

        '
      responses:
        '200':
          description: Sesión cerrada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Sesion cerrada exitosamente. Descarte el token en memoria.
  /api/auth/me:
    get:
      tags:
      - Autenticación
      summary: Consultar perfil del usuario autenticado
      description: Retorna el identificador, nombre de usuario, rol institucional
        y estado de actividad.
      responses:
        '200':
          description: Perfil recuperado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401':
          description: No autenticado o token JWT inválido/expirado/revocado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/cambiar-password:
    post:
      tags:
      - Autenticación
      summary: Cambiar contraseña voluntariamente o en primer ingreso (UC-PROV-03 A1)
      description: Permite actualizar la contraseña verificando la credencial actual y aplicando la política de complejidad. Invalida sesiones activas en otros dispositivos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
        '400':
          description: Datos inválidos o incumplimiento de política de complejidad (E3).
        '401':
          description: Contraseña actual incorrecta (E1).
  /api/auth/conmutar-rol:
    post:
      tags:
      - Autenticación
      summary: Conmutar rol activo en sesión (UC-01 A2, RN-SEG-04)
      description: Emite un nuevo token con los permisos mínimos del rol seleccionado sin acumular privilegios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConmutarRolRequest'
      responses:
        '200':
          description: Rol activo conmutado exitosamente. Retorna nuevo token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: El rol solicitado no está vigente para el usuario (E3).
  /api/auth/recuperar-password/solicitar:
    post:
      tags:
      - Autenticación
      summary: Solicitar recuperación de contraseña por autoservicio (UC-PROV-03)
      description: Procesa la solicitud pública en tiempo constante respondiendo con mensaje neutro para prevenir enumeración de cuentas (E1).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRecuperacionPasswordRequest'
      responses:
        '200':
          description: Solicitud procesada uniformemente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
  /api/auth/recuperar-password/confirmar:
    post:
      tags:
      - Autenticación
      summary: Confirmar restablecimiento de contraseña mediante token (UC-PROV-03)
      description: Valida el token de un solo uso y su vigencia para registrar la nueva contraseña (E2, E3).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmacionRecuperacionPasswordRequest'
      responses:
        '200':
          description: Contraseña restablecida exitosamente.
        '400':
          description: Token inválido, expirado o contraseña no cumple requisitos (E2, E3).
  /api/usuarios:
    get:
      tags:
      - Usuarios y Roles
      summary: Listar cuentas de usuario paginadas (UC-PROV-01)
      description: Consulta administrativa de usuarios. Requiere rol ADMINISTRADOR, RECTOR o SECRETARIA.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Listado paginado de usuarios.
    post:
      tags:
      - Usuarios y Roles
      summary: Aprovisionar cuenta de usuario con credencial temporal (UC-PROV-01)
      description: Crea la cuenta en estado PENDIENTE_ACTIVACION. Secretaría solo puede crear Estudiantes y Acudientes (E3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Cuenta creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '409':
          description: Conflicto de unicidad de username o cuenta ya existente (E1).
  /api/usuarios/{id}:
    get:
      tags:
      - Usuarios y Roles
      summary: Obtener detalle de cuenta de usuario
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Detalle del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '404':
          description: Usuario no encontrado.
    delete:
      tags:
      - Usuarios y Roles
      summary: Intento de eliminación física (prohibido por norma) (UC-PROV-01 E4)
      description: Siempre responde HTTP 409 Conflicto por regla de inmutabilidad y no borrado físico (RN-SEG-01).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '409':
          description: Prohibición absoluta de borrado físico. Debe inactivarse.
  /api/usuarios/{id}/estado:
    patch:
      tags:
      - Usuarios y Roles
      summary: Modificar estado de cuenta con motivo obligatorio (UC-PROV-01 A2)
      description: Permite bloquear, inactivar o pasar a estado histórico restringido.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEstadoUsuarioRequest'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
  /api/usuarios/{id}/restablecer-presencial:
    post:
      tags:
      - Usuarios y Roles
      summary: Restablecimiento presencial asistido en ventanilla de Secretaría (UC-PROV-03 A2)
      description: Genera credencial temporal de un solo uso, coloca cuenta en PENDIENTE_ACTIVACION e invalida sesiones activas en servidor (RN-SEG-06).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: motivo
        in: query
        schema:
          type: string
          default: Trámite presencial en Secretaría Académica
      responses:
        '200':
          description: Credencial temporal generada con constancia auditada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestablecimientoPresencialResponse'
  /api/usuarios/{id}/roles:
    get:
      tags:
      - Usuarios y Roles
      summary: Listar roles asignados al usuario (UC-PROV-02)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Lista de roles del usuario.
    post:
      tags:
      - Usuarios y Roles
      summary: Asignar rol compatible con vigencia temporal (UC-PROV-02 A1)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarRolUsuarioRequest'
      responses:
        '201':
          description: Rol asignado exitosamente.
        '409':
          description: Incompatibilidad de roles o segregación de funciones (E1).
  /api/usuarios/{id}/roles/{rolId}:
    delete:
      tags:
      - Usuarios y Roles
      summary: Revocar rol asignado (UC-PROV-02)
      description: Revoca rol protegiendo el último administrador activo (E3).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: rolId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Rol revocado exitosamente.
        '409':
          description: Rechazado si es el último administrador activo (E3).
  /api/usuarios/{id}/organos-colegiados:
    get:
      tags:
      - Usuarios y Roles
      summary: Listar designaciones en órganos colegiados (UC-PROV-02 A2)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Lista de membresías.
    post:
      tags:
      - Usuarios y Roles
      summary: Registrar miembro nominativo en órgano colegiado (UC-PROV-02 A2)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarOrganoColegiadoRequest'
      responses:
        '201':
          description: Membresía registrada con soporte de acta institucional.
  /api/usuarios/organos-colegiados/{miembroId}:
    delete:
      tags:
      - Usuarios y Roles
      summary: Remover membresía de órgano colegiado (UC-PROV-02)
      parameters:
      - name: miembroId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Membresía revocada exitosamente.
  /api/configuracion/institucion:
    get:
      tags:
      - Configuración Institucional
      summary: Consultar identificación legal oficial y firmas vigentes (UC-PROV-14)
      description: Endpoint público / comunitario para consultar código DANE, NIT, resoluciones y firmantes autorizados.
      security: []
      responses:
        '200':
          description: Datos legales vigentes del establecimiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitucionDatosLegalesResponse'
    put:
      tags:
      - Configuración Institucional
      summary: Actualizar datos oficiales y firmas autorizadas de Rectoría y Secretaría (UC-PROV-13)
      description: Requiere rol ADMINISTRADOR o RECTOR. Valida código DANE de 12 dígitos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarInstitucionRequest'
      responses:
        '200':
          description: Datos institucionales actualizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitucionDatosLegalesResponse'
        '400':
          description: Código DANE inválido u otros campos incompletos.
  /api/configuracion/parametros:
    get:
      tags:
      - Configuración Institucional
      summary: Listar parámetros institucionales transversales (UC-PROV-13)
      responses:
        '200':
          description: Lista de parámetros.
  /api/configuracion/parametros/{clave}:
    get:
      tags:
      - Configuración Institucional
      summary: Consultar un parámetro institucional por su clave
      parameters:
      - name: clave
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Detalle del parámetro.
    put:
      tags:
      - Configuración Institucional
      summary: Modificar valor de parámetro institucional con control de límites (UC-PROV-13 E1)
      description: Aplica límites legales obligatorios como PLAZO_ARCO_DIAS_HABILES <= 15 días (E1).
      parameters:
      - name: clave
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarParametroRequest'
      responses:
        '200':
          description: Parámetro actualizado.
        '400':
          description: Valor supera límite legal o parámetro no es editable (E1).
  /api/configuracion/politica-datos/vigente:
    get:
      tags:
      - Configuración Institucional
      summary: Consultar versión vigente de la Política de Tratamiento de Datos Personales (UC-PROV-14 A2)
      description: Lectura pública de Habeas Data (Ley 1581 de 2012 / Decreto 1377 de 2013).
      security: []
      responses:
        '200':
          description: Versión vigente de la política y aviso de privacidad.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaDatosResponse'
  /api/configuracion/politica-datos:
    get:
      tags:
      - Configuración Institucional
      summary: Listar versiones históricas y vigentes de la Política de Datos (UC-PROV-14)
      responses:
        '200':
          description: Listado de versiones.
    post:
      tags:
      - Configuración Institucional
      summary: Publicar nueva versión inmutable de la Política de Datos (UC-PROV-13 A1)
      description: No sobrescribe versiones históricas previamente aceptadas (E2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPoliticaDatosRequest'
      responses:
        '201':
          description: Nueva versión publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaDatosResponse'
  /api/configuracion/politica-datos/consentimiento:
    post:
      tags:
      - Configuración Institucional
      summary: Registrar consentimiento informado de usuario autenticado (UC-01 A1, UC-PROV-13)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarConsentimientoRequest'
      responses:
        '200':
          description: Consentimiento registrado de forma auditable.
  /api/configuracion/siee/vigente:
    get:
      tags:
      - Configuración Institucional
      summary: Consultar versión vigente del SIEE y tabla de equivalencias (UC-PROV-14)
      security: []
      responses:
        '200':
          description: SIEE oficial vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionSieeResponse'
  /api/configuracion/siee:
    get:
      tags:
      - Configuración Institucional
      summary: Listar versiones del SIEE (borradores, vigentes e históricas) (UC-26)
      responses:
        '200':
          description: Historial de versiones del SIEE.
  /api/configuracion/siee/borrador:
    post:
      tags:
      - Configuración Institucional
      summary: Crear propuesta o borrador de versión del SIEE (UC-26 A1)
      description: Valida matemáticamente escalas sin vacíos ni traslapes (E1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearSieeBorradorRequest'
      responses:
        '201':
          description: Borrador creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionSieeResponse'
        '400':
          description: Inconsistencia matemática en escala o ponderaciones (E1).
  /api/configuracion/siee/{id}/aprobar:
    post:
      tags:
      - Configuración Institucional
      summary: Formalizar y publicar versión aprobada del SIEE con actas colegiadas (UC-26)
      description: Exige actas de Consejo Académico y Consejo Directivo (E2). No aplica retroactivamente a periodos cerrados (E3).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AprobarSieeRequest'
      responses:
        '200':
          description: Versión del SIEE publicada como VIGENTE.
        '409':
          description: Faltan actas obligatorias (E2), intenta alterar versión histórica (E5) o aplicar a año cerrado (E3).
  /api/configuracion/manual-convivencia/vigente:
    get:
      tags:
      - Configuración Institucional
      summary: Consultar versión vigente del Manual de Convivencia (UC-PROV-14)
      security: []
      responses:
        '200':
          description: Manual de convivencia vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionManualConvivenciaResponse'
  /api/configuracion/manual-convivencia/{id}/aprobar:
    post:
      tags:
      - Configuración Institucional
      summary: Aprobar y publicar Manual de Convivencia con actas colegiadas (UC-26)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AprobarManualConvivenciaRequest'
      responses:
        '200':
          description: Manual publicado como VIGENTE.
        '409':
          description: Faltan actas de Comité de Convivencia y Consejo Directivo (E2).
  /api/auditoria/eventos:
    get:
      tags:
      - Auditoría Global
      summary: Consultar bitácora transversal inmutable con filtros y paginación (UC-27)
      description: Requiere rol ADMINISTRADOR o RECTOR. Consulta de solo lectura (RN-10).
      parameters:
      - name: modulo
        in: query
        schema:
          type: string
      - name: desde
        in: query
        schema:
          type: string
          format: date-time
      - name: hasta
        in: query
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Página de eventos de auditoría.
  /api/auditoria/eventos/correlation/{correlationId}:
    get:
      tags:
      - Auditoría Global
      summary: Reconstrucción cronológica de trazabilidad por correlationId (UC-27 A4)
      parameters:
      - name: correlationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Secuencia cronológica de eventos.
  /api/auditoria/eventos/entidad/{entidad}/{entidadId}:
    get:
      tags:
      - Auditoría Global
      summary: Reconstrucción cronológica de cambios sobre una entidad específica (UC-27 A4)
      parameters:
      - name: entidad
        in: path
        required: true
        schema:
          type: string
      - name: entidadId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Historial de eventos de la entidad.
  /api/auditoria/verificar-integridad:
    get:
      tags:
      - Auditoría Global
      summary: Ejecutar verificación criptográfica de integridad de la cadena SHA-256 (UC-PROV-29)
      description: Recalcula matemáticamente la cadena completa de hashes para detectar inserciones, modificaciones o supresiones directas en base de datos.
      responses:
        '200':
          description: Resultado de la verificación técnica (CADENA_INTEGRA_VERIFICADA o ALERTA_CRITICA_INTEGRIDAD_AUDITORIA).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacionIntegridadResponse'
  /api/auditoria/exportar:
    post:
      tags:
      - Auditoría Global
      summary: Exportar paquete regulatorio de auditoría firmado con manifiesto SHA-256 (UC-PROV-29 paso 5-6)
      description: Requiere rol RECTOR y número de requerimiento oficial de autoridad competente (E3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportacionAuditoriaRequest'
      responses:
        '200':
          description: Paquete oficial de auditoría con manifiesto SHA-256 generado y auditado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaqueteAuditoriaExportadoResponse'
        '400':
          description: Falta oficio o motivo obligatorio (E3).
  /api/estudiantes/expediente-completo:
    post:
      tags:
      - Estudiantes
      summary: Registro atómico del expediente del estudiante, acudiente y consentimiento (UC-12)
      description: Registra en una sola transacción los datos personales, acudiente principal obligatorio y autorización de datos del menor (RN-EST-01, RN-EST-05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpedienteCompletoRequest'
      responses:
        '201':
          description: Expediente registrado exitosamente en estado LISTO_PARA_MATRICULA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpedienteCompletoResponse'
        '400':
          description: Campos obligatorios incompletos o inválidos (E1).
        '409':
          description: Conflicto de acudiente principal o precondiciones incumplidas (E2, E3).
  /api/estudiantes/mi-ficha:
    get:
      tags:
      - Estudiantes
