tags:
- name: Profesores
  description: Gestión de docentes, datos profesionales y vinculación a cuentas de
    usuario
- name: Asignaciones Académicas
  description: Asignación curricular docente-grupo-asignatura e intensidad horaria
- name: Matrículas
  description: Inscripción formal de estudiantes, control de cupos por grupo, historial y traslados
- name: Calificaciones y SIEE
  description: Gestión de escalas institucionales (Decreto 1290), actividades evaluativas, registro de notas, definitivas y auditoría
- name: Control de Asistencia
  description: Registro de asistencia dual (sesión de clase y jornada diaria), justificaciones auditadas y alertas tempranas de ausentismo
- name: Documentos y Reportes Académicos
  description: Emisión y auditoría de documentos oficiales (boletines periódicos y finales, certificados de estudio, constancias de matrícula y verificación de autenticidad)
- name: Usuarios y Roles
  description: Ciclo de vida de cuentas, asignación de roles múltiples con vigencia y miembros de órganos colegiados (UC-PROV-01, UC-PROV-02)
- name: Configuración Institucional
  description: Identificación legal DANE, firmas oficiales, Política de Datos inmutable Ley 1581 y versionamiento colegiado del SIEE y Manual (UC-26, UC-PROV-13, UC-PROV-14)
- name: Auditoría Global
  description: Bitácora transversal append-only con encadenamiento criptográfico SHA-256, verificación de integridad y exportación regulada (UC-27, UC-PROV-29)
