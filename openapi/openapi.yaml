        gradoNombre:
          type: string
          example: "Décimo"
        nombre:
          type: string
          example: "A"
        jornada:
          $ref: '#/components/schemas/Jornada'
        cupoMaximo:
          type: integer
          example: 35
        activo:
          type: boolean
          example: true
        fechaCreacion:
          type: string
          format: date-time
        fechaActualizacion:
          type: string
          format: date-time

